<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>წვდომის მოლოდინში - YourStats</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        appBg: '#080912',
                        surface: '#0F111D',
                        primary: '#6366F1',
                        primaryHover: '#4F46E5',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .glass-panel {
            background: rgba(15, 17, 29, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.12);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
        .gradient-text {
            background: linear-gradient(135deg, #818CF8 0%, #6366F1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-background {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden; background-color: #080912;
        }
        .bg-glow {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%); width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(79, 70, 229, 0.02) 50%, transparent 70%);
            border-radius: 50%; pointer-events: none; filter: blur(60px);
        }
    </style>
</head>
<body class="bg-transparent text-gray-300 min-h-screen font-sans antialiased flex flex-col items-center justify-center p-4 selection:bg-indigo-500/30 selection:text-white">

    <div class="app-background">
        <div class="bg-glow"></div>
    </div>

    <div class="flex flex-col items-center mb-6 animate-fade-in">
        <div class="bg-gradient-to-br from-indigo-500 to-indigo-700 p-3 rounded-2xl shadow-lg shadow-indigo-500/30 mb-3 border border-indigo-400/20">
            <i data-lucide="line-chart" class="w-8 h-8 text-white"></i>
        </div>
        <div class="font-bold text-2xl text-white tracking-tight">Your<span class="gradient-text">Stats</span></div>
        <div class="text-xs text-gray-400 font-medium tracking-wide mt-0.5">Created by Sandrika</div>
    </div>

    <div class="glass-panel p-8 rounded-2xl max-w-md w-full text-center animate-fade-in relative overflow-hidden">
        <div class="w-12 h-12 bg-indigo-500/10 rounded-xl border border-indigo-500/20 flex items-center justify-center mx-auto mb-5 text-indigo-400 shadow-inner">
            <i data-lucide="clock" class="w-6 h-6"></i>
        </div>
        
        <h1 class="text-xl font-bold text-white mb-3">წვდომის მოლოდინში</h1>
        <p class="text-sm text-gray-400 leading-relaxed mb-6">
            შენი ანგარიში წარმატებით შეიქმნა! სერვისით სარგებლობისთვის და შესაძენად (ღირებულება: <span class="text-white font-semibold">$4.99</span>) გთხოვთ დაუკავშირდეთ ადმინისტრატორს დისქორდში: <span class="text-indigo-400 font-semibold">{{ discord_tag | default('cs2sacc') }}</span>, რის შემდეგაც თქვენი აქაუნთი გააქტიურდება.
        </p>

        <div class="border-t border-white/5 pt-4">
            <a href="{{ url_for('logout') }}" class="text-sm font-medium text-rose-400 hover:text-rose-300 transition inline-flex items-center gap-2">
                <i data-lucide="log-out" class="w-4 h-4"></i> გასვლა
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
