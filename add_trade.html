<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourStats - ახალი ტრეიდი</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        appBg: '#05070B',
                        surface: '#11151F',
                        surfaceHover: '#181E2C',
                        primary: '#6366F1',
                        success: '#10B981',
                        danger: '#EF4444',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #05070B; }
        ::-webkit-scrollbar-thumb { background: #1F2937; border-radius: 4px; }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .glass-panel {
            background: rgba(17, 21, 31, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .gradient-text {
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-background {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden; background-color: #05070B;
        }
        .bg-glow-1 {
            position: absolute; top: -10%; left: 20%; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(139, 92, 246, 0.05) 40%, transparent 70%);
            border-radius: 50%; pointer-events: none; filter: blur(60px);
        }
        .bg-glow-2 {
            position: absolute; bottom: -15%; right: 10%; width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, rgba(59, 130, 246, 0.03) 50%, transparent 70%);
            border-radius: 50%; pointer-events: none; filter: blur(80px);
        }
        .bg-grid {
            position: absolute; inset: 0;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(circle at 50% 20%, black 40%, transparent 80%);
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-transparent text-gray-300 min-h-screen font-sans antialiased">

    <div class="app-background">
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="bg-grid"></div>
    </div>

    <nav class="glass-panel sticky top-0 z-50 border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-2 rounded-xl shadow-lg shadow-indigo-500/20">
                        <i data-lucide="line-chart" class="w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <span class="font-bold text-xl text-white tracking-tight">Your<span class="gradient-text">Stats</span></span>
                        <p class="text-[10px] text-gray-400 -mt-1 font-medium tracking-wide">Created by Sandrika</p>
                    </div>
                </div>
                <div>
                    <a href="{{ url_for('index') }}" class="px-4 py-2 rounded-xl text-sm font-medium text-gray-400 hover:text-white hover:bg-white/5 transition flex items-center gap-2">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> უკან
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-10 animate-fade-in">
        <div class="glass-panel p-8 rounded-2xl shadow-2xl space-y-6 relative overflow-hidden">
            <div class="absolute -right-20 -top-20 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="border-b border-white/5 pb-4">
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-400"></i> ახალი ტრეიდის რეგისტრაცია
                </h1>
                <p class="text-xs text-gray-400 mt-1">შეიყვანეთ ტრეიდის დეტალები სავაჭრო ჟურნალისთვის.</p>
            </div>

            <form action="{{ url_for('add_trade') }}" method="POST" class="space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5">თარიღი *</label>
                        <input type="date" id="tradeDate" name="date" required class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5">სავაჭრო წყვილი (Pair) *</label>
                        <input type="text" name="pair" placeholder="EURUSD / BTCUSD" required class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 uppercase transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5">მხარე (Side) *</label>
                        <select name="direction" class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                            <option value="LONG" class="bg-surface">LONG (ყიდვა)</option>
                            <option value="SHORT" class="bg-surface">SHORT (გაყიდვა)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5">შესვლის ფასი *</label>
                        <input type="number" step="any" name="entry_price" placeholder="0.00" required class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5">გასვლის ფასი *</label>
                        <input type="number" step="any" name="exit_price" placeholder="0.00" required class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5">PnL ($) *</label>
                        <input type="number" step="any" name="pnl" placeholder="მაგ: 150 ან -50" required class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5">ემოცია / მდგომარეობა</label>
                        <select name="emotion" class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                            <option value="მშვიდი" class="bg-surface">მშვიდი</option>
                            <option value="აჩქარებული" class="bg-surface">აჩქარებული</option>
                            <option value="გაბრაზებული" class="bg-surface">გაბრაზებული (Tilt)</option>
                            <option value="თავდაჯერებული" class="bg-surface">თავდაჯერებული</option>
                            <option value="ზოგადი" class="bg-surface">ზოგადი</option>
                        </select>
                    </div>
                    
                    <!-- Base64 სურათის ასატვირთი ველი -->
                    <div>
<label class="block text-xs font-medium text-gray-400 mb-1.5">ტრეიდის სქრინი (სურათი)</label>
        <input type="file" id="imageInput" accept="image/*" class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-gray-400 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer transition">
        <!-- ეს ფარული ველი გადასცემს სურათის ტექსტურ კოდს ბექენდს -->
        <input type="hidden" name="screenshot" id="base64Field">
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:scale-[1.01] text-sm flex items-center justify-center gap-2">
                        <i data-lucide="check" class="w-5 h-5"></i> ტრეიდის შენახვა
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();
        document.getElementById('tradeDate').valueAsDate = new Date();

// JavaScript, რომელიც არჩეულ სურათს გადააქცევს Base64 ტექსტად
    document.getElementById('imageInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('base64Field').value = e.target.result;
            };
            reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
